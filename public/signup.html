<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HabitCoachAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page-wrapper">
    <div class="glass-container">
        <header>
            <div class="auth-brand-mark">H</div>
            <h1>HabitCoach<span>AI</span></h1>
            <p class="subtitle">Create an account to start building momentum.</p>
        </header>

        <main>
            <form id="signupForm" class="auth-form">
                <input type="text" id="name" placeholder="Full Name" required />
                <input type="email" id="email" placeholder="Email" required />
                <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6"/>
                <button type="submit" id="authSubmitBtn">Sign Up</button>
            </form>
            <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
        </main>

        <footer>
            <p id="error" class="error-text"></p>
        </footer>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
