<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HabitCoachAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page-wrapper">
        <main class="verify-container" aria-labelledby="resetTitle">
            <div class="auth-brand-mark">H</div>
            <p class="eyebrow">Account security</p>
            <h1 id="resetTitle">Set a new password</h1>
            <p id="message" class="subtitle">Please enter a new password for your HabitCoachAI account.</p>

            <form id="resetPasswordForm" class="auth-form reset-password-form">
                <input id="password" type="password" placeholder="New password" minlength="6" autocomplete="new-password" required>
                <button id="submit" class="send-btn" type="submit">Reset password</button>
            </form>

            <p id="result" class="verify-message" role="status" aria-live="polite"></p>
            <p class="auth-link"><a href="login.html">Back to login</a></p>
        </main>
    </div>

    <div id="appToast" class="app-toast hidden" role="status" aria-live="polite"></div>
    <script src="reset-password.js"></script>
</body>
</html>
