<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f0b29" />
      <stop offset="100%" stop-color="#02000a" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Maskable background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="12" y="12" width="168" height="168" rx="34" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.25" />

  <!-- Dynamic Arrow Group (Progress) -->
  <g transform="translate(96, 96)">
    <!-- Glow behind arrow -->
    <path d="M-28,16 L-28,-8 L0,-32 L28,-8 L28,16 L12,16 L12,4 L-12,4 L-12,16 Z" fill="url(#accentGrad)" opacity="0.2" filter="url(#glow)" />
    
    <!-- Letter H & Progress arrow design -->
    <path d="M-28,24 L-28,-24 L-14,-24 L-14,-4 L14,-4 L14,-24 L28,-24 L28,24 L14,24 L14,8 L-14,8 L-14,24 Z" fill="url(#accentGrad)" />
    
    <!-- Rising chevron peak -->
    <path d="M-20,-28 L0,-46 L20,-28 L10,-28 L0,-38 L-10,-28 Z" fill="url(#accentGrad)" />
  </g>
</svg>
