<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HabitCoachAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page-wrapper">
    <div class="glass-container">
        <header>
            <div class="auth-brand-mark">H</div>
            <h1>HabitCoach<span>AI</span></h1>
            <p class="subtitle">Welcome back to your personal operating system.</p>
        </header>

        <main>
            <form id="loginForm" class="auth-form">
                <input type="email" id="email" placeholder="Email" required />
                <input type="password" id="password" placeholder="Password" required />
                <button id="showForgotPasswordBtn" class="auth-inline-link" type="button">Forgot password?</button>
                <button type="submit" id="authSubmitBtn">Login</button>
            </form>

            <form id="forgotPasswordForm" class="auth-form forgot-password-form hidden">
                <p class="auth-helper-text">Enter your email and we will send a password reset link.</p>
                <input type="email" id="forgotEmail" placeholder="Email" required />
                <button type="submit" id="forgotSubmitBtn">Send reset link</button>
                <button id="cancelForgotPasswordBtn" class="auth-inline-link" type="button">Back to login</button>
            </form>

            <p class="auth-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </main>

        <footer>
            <p id="error" class="error-text"></p>
        </footer>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
